{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | WebOps Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        <span class="webops-s-c7e9fcd">
            WebOps
        </span>
        Admin
    </a>
</h1>
{% endblock %}

{% block extrastyle %}

    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/themes.css' %}">
    <link rel="stylesheet" href="{% url 'branding_css' %}">
    {{ block.super }}
    <link rel="stylesheet" type="text/css" href="{% static 'admin/css/webops-admin.css' %}">
{% endblock %}

{% block nav-global %}{% endblock %}
