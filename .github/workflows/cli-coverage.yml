name: CLI 100% Statement Coverage

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-coverage:
    name: CLI statement coverage (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cli/requirements.txt
      - name: Install CLI and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./cli pytest pytest-cov pytest-asyncio
      - name: Run CLI suite with the 100% coverage gate
        working-directory: cli
        run: |
          python -m pytest -q tests/
          python -m coverage report --fail-under=100
      - name: Preserve inspectable coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-coverage
          path: |
            cli/coverage.xml
          if-no-files-found: ignore

# This is 100% measured statement coverage for webops_cli.
# It does not imply 100% branch coverage or integration reliability.
