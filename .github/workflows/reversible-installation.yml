name: Reversible Installation Safety

on:
  push:
    branches: [main]
    paths:
      - 'provisioning/versions/v1.0.0/lifecycle/**'
      - 'provisioning/versions/v1.0.0/addons/monitoring.sh'
      - 'provisioning/versions/v1.0.0/lib/common.sh'
      - 'provisioning/versions/v1.0.0/setup/validate.sh'
      - 'provisioning/versions/v1.0.0/dev/quickstart.sh'
      - 'Makefile'
      - 'provisioning/versions/v1.0.0/setup/base.sh'
      - 'provisioning/versions/v1.0.0/bin/webops'
      - 'provisioning/versions/v1.0.0/tests/**'
      - '.github/workflows/reversible-installation.yml'
  pull_request:
    paths:
      - 'provisioning/versions/v1.0.0/lifecycle/**'
      - 'provisioning/versions/v1.0.0/addons/monitoring.sh'
      - 'provisioning/versions/v1.0.0/lib/common.sh'
      - 'provisioning/versions/v1.0.0/setup/validate.sh'
      - 'provisioning/versions/v1.0.0/dev/quickstart.sh'
      - 'Makefile'
      - 'provisioning/versions/v1.0.0/setup/base.sh'
      - 'provisioning/versions/v1.0.0/bin/webops'
      - 'provisioning/versions/v1.0.0/tests/**'

jobs:
  safe-uninstall:
    name: Isolated install/uninstall safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate lifecycle script syntax
        run: |
          bash -n provisioning/versions/v1.0.0/lifecycle/install.sh
          bash -n provisioning/versions/v1.0.0/addons/monitoring.sh
          bash -n provisioning/versions/v1.0.0/dev/quickstart.sh
          bash -n provisioning/versions/v1.0.0/lifecycle/uninstall.sh
          bash -n provisioning/versions/v1.0.0/bin/webops
          bash -n provisioning/versions/v1.0.0/setup/base.sh
          python -m py_compile provisioning/versions/v1.0.0/lifecycle/installation_inventory.py
      - name: Install test runner
        run: python -m pip install pytest==9.2.0
      - name: Run resilience matrix and lifecycle contracts (3000+ cases)
        run: |
          python -m pytest -q provisioning/versions/v1.0.0/tests
